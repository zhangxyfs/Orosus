<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orosus（连山）· 三省六部朝会 UI 原型（真实 UI 体系复刻版）</title>
<style>
  /* ─── 连山主题色 · 逐值对齐 apps/cli/src/theme.ts:9-27 ────────── */
  :root {
    --bg: #0a100e;        /* 页面背景 */
    --surface: #121b17;   /* 面板底（查看窗滚动条轨道） */
    --surface2: #18241e;  /* 输入框/弹窗/菜单整行铺底 */
    --fg: #e9eee6;
    --muted: #97a49a;
    --border: #25352d;
    --accent: #7cc9a5;    /* 青玉：选中/焦点框线/● */
    --info: #84b8cd;      /* 石青 */
    --warn: #d4a25e;      /* 暖金 */
    --err: #d07f70;       /* 赭石 */
    --diff-add: #4ec87e;
    --diff-del: #e85454;
    --accent-soft: #1a2a23; /* 选中行软底（theme 派生写死值） */
    --font-mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Microsoft YaHei', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }

  .notebar { max-width: 1280px; margin: 18px auto 10px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; }
  .notebar b { color: var(--fg); }
  .notebar .proto { color: var(--warn); }
  .wrap { max-width: 1280px; margin: 0 auto 48px; padding: 0 14px; }

  .stepbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 10px; }
  .chip { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); opacity: .55; cursor: pointer; user-select: none; }
  .chip.done { opacity: 1; color: var(--muted); }
  .chip.cur { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; opacity: 1; }
  .chip .n { opacity: .55; margin-right: 4px; }
  .navrow { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .navbtn { font: inherit; font-size: 12.5px; padding: 5px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); cursor: pointer; }
  .navbtn:hover { border-color: var(--accent); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .navrow .pos { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 1fr 312px; gap: 14px; align-items: start; }
  @media (max-width: 1020px) { .layout { grid-template-columns: 1fr; } }

  /* ══ 终端帧：无外框（fullscreen 不铺全屏底色，行组件自填） ══ */
  .term { position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); overflow: hidden; font-family: var(--font-mono); font-size: 12.5px; min-height: 620px; }
  .term .tb { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .term-main { display: grid; grid-template-columns: 1fr 312px; gap: 10px; padding: 10px 12px 12px; }
  .leftcol { display: flex; flex-direction: column; min-width: 0; }

  /* 流区：每行前导 2 空格内衬（frame.ts:128-149） */
  .stream { flex: 1; padding: 0 0 6px; overflow: hidden; }
  .stream .ln { padding: 0 0 0 2px; white-space: pre-wrap; word-break: break-all; }
  .dim { color: var(--muted); } .dim2 { color: var(--muted); opacity: .62; }
  .acc { color: var(--accent); } .warn { color: var(--warn); } .err { color: var(--err); } .infoc { color: var(--info); }

  /* 启动横幅（入流区非常驻 · main.ts:1148-1170 缩略示意） */
  .bannerbox { border: 1px solid var(--accent); border-radius: 4px; padding: 6px 10px; margin: 2px 0 6px; color: var(--accent); display: inline-block; }
  .bannerbox .blk { font-weight: 700; letter-spacing: .18em; }
  .verline { color: var(--fg); } .verline b { color: var(--fg); }
  .slogan { color: var(--muted); }
  .keyguide { color: var(--muted); opacity: .62; }

  /* 用户块 / 工具行（docmodel.ts:870-875 / render.ts:114-127） */
  .uline { color: var(--fg); white-space: pre-wrap; word-break: break-all; }
  .uline::before { content: "❯ "; color: var(--accent); font-weight: 700; }
  .tl { white-space: pre-wrap; word-break: break-all; }
  .tl .dot { color: var(--accent); font-weight: 700; }
  .tl .verb { color: var(--fg); }
  .tl .tname { color: var(--accent); }
  .tl .tail { color: var(--muted); }
  .tl.busy .dot { color: var(--warn); }
  .tl.fail .dot, .tl.fail .tail { color: var(--err); }

  /* 子代理组树（subagent-status.ts:85-150） */
  .grp { margin-top: 4px; }
  .grp-first { font-weight: 600; }
  .grp-sub { white-space: pre-wrap; word-break: break-all; }
  .grp-sub .branch { color: var(--muted); opacity: .8; }
  .grp-sub .gname { color: var(--accent); }
  .grp-sub .gstats { color: var(--muted); }

  /* 思考块（docmodel.ts:174-181, 902-908） */
  .think-head { color: var(--muted); margin-top: 4px; }
  .think-tail { color: var(--muted); padding-left: 14px; }

  /* 结果折叠行（docmodel.ts:444-547） */
  .foldline { color: var(--muted); padding-left: 14px; }
  .foldline.clk:hover { color: var(--fg); }
  .resbody { color: var(--fg); padding-left: 4px; }

  /* 流区尾行（fullapp-panels.ts:123-142） */
  .tail-line { margin-top: 4px; color: var(--muted); }
  .tail-line .sp { color: var(--accent); }

  /* toast：无框暖金字叠输入框顶边上方（frame.ts:169-178） */
  .toastline { color: var(--warn); padding: 2px 2px; margin-bottom: 2px; }

  /* 输入框 ╭╮ 圆角盒（frame.ts:159-212）：聚焦 accent · 失焦 border+整行 dim */
  .inputbox { border: 1px solid var(--accent); border-radius: 6px; background: var(--surface2); padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
  .inputbox .p { color: var(--accent); font-weight: 700; }
  .inputbox .txt { color: var(--fg); white-space: pre-wrap; word-break: break-all; }
  .inputbox .txt.holder { color: var(--muted); opacity: .62; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 1.1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* footer 提示行（frame.ts:200-211） */
  .footline { display: flex; justify-content: space-between; gap: 8px; padding: 5px 2px 0; color: var(--muted); opacity: .8; font-size: 11.5px; }
  .footline .perm { color: var(--accent); } .footline .perm.never { color: var(--warn); }
  .footline .running { color: var(--accent); }

  /* ══ 右栏卡片：╭─ title ── en ─╮ 顶边嵌标题 · 内底透明（panels.ts:17-54） ══ */
  .sidecol { display: flex; flex-direction: column; gap: 12px; }
  .card { position: relative; border: 1px solid var(--border); border-radius: 6px; padding: 14px 10px 6px; }
  .card.focus { border-color: var(--accent); }
  .card .head { position: absolute; top: -8px; left: 8px; background: var(--bg); padding: 0 6px; font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .card.focus .head { color: var(--accent); }
  .card .en { position: absolute; top: -8px; right: 8px; background: var(--bg); padding: 0 6px; font-size: 11px; color: var(--muted); opacity: .62; }
  .card .crow { display: flex; padding: 1px 2px; font-size: 12px; color: var(--fg); }
  .card .crow .k { color: var(--muted); min-width: 8ch; }
  .card .crow .v { color: var(--info); }
  .sep { color: var(--border); overflow: hidden; white-space: nowrap; margin: 3px 0; }
  .ctxrow { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .ctxrow .lab { color: var(--muted); }
  .ctxrow .bar { color: var(--accent); letter-spacing: -.5px; }
  .ctxrow .bar .empty { color: var(--muted); opacity: .55; }
  .ctxrow .num { color: var(--muted); }
  .modhead { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin: 2px 0; }
  .modhead .r { opacity: .62; }
  .modrow { display: flex; gap: 6px; font-size: 12px; padding: 1px 2px; }
  .modrow .d { width: 10px; text-align: center; }
  .modrow .nm { color: var(--fg); } .modrow .nm .lk { color: var(--muted); opacity: .62; }
  .modrow .st { margin-left: auto; color: var(--muted); opacity: .75; }
  .taskrow { display: flex; gap: 7px; font-size: 12px; padding: 1px 2px; }
  .taskrow.done .t { color: var(--muted); text-decoration: line-through; }
  .taskrow.active .t { color: var(--warn); }
  .cardfoot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); opacity: .62; padding: 4px 2px 2px; }
  .cardhint { font-size: 11px; color: var(--muted); opacity: .62; padding: 2px 2px 4px; }

  /* ══ dock 进程窗 / 弹窗：accent 圆角框 · 整行铺 surface2 · 底边贴输入框顶边（overlay.ts:104-110,167-179） ══ */
  .dockzone { padding: 10px 0 6px; position: relative; }
  .dlg { position: relative; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface2); padding: 13px 10px 7px; }
  .dlg .head { position: absolute; top: -8px; left: 8px; background: var(--surface2); padding: 0 6px; font-size: 11px; color: var(--accent); letter-spacing: .05em; }
  .dlg .hk { position: absolute; top: -8px; right: 8px; background: var(--surface2); padding: 0 6px; font-size: 11px; color: var(--warn); }
  .dlg .hk.plain { color: var(--muted); opacity: .8; }
  .dw { padding: 1px 4px; font-size: 12.5px; color: var(--fg); white-space: pre-wrap; word-break: break-all; }
  .dw.muted { color: var(--muted); } .dw.warn { color: var(--warn); } .dw.accent { color: var(--accent); }
  .prog { display: flex; align-items: center; gap: 6px; padding: 3px 4px; }
  .prog .bar { color: var(--accent); letter-spacing: -.5px; }
  .prog .bar .empty { color: var(--muted); opacity: .55; }
  .prog .num { color: var(--muted); font-size: 12px; }
  table.wtab { width: 100%; border-collapse: collapse; margin: 4px 0 2px; font-size: 12px; }
  table.wtab th { font-weight: 400; color: var(--muted); border: 1px solid var(--border); padding: 2px 6px; text-align: left; font-size: 11.5px; }
  table.wtab td { border: 1px solid var(--border); padding: 3px 6px; color: var(--fg); }
  table.wtab td .st-run { color: var(--warn); } table.wtab td .st-queue { color: var(--muted); opacity: .62; }
  table.wtab td .st-wave { color: var(--info); } table.wtab td .st-done { color: var(--accent); }
  tr.clk { cursor: pointer; } tr.clk:hover td { background: var(--accent-soft); }
  .keysrow { padding: 5px 4px 2px; font-size: 11.5px; color: var(--muted); opacity: .8; }
  .keysrow b { color: var(--muted); font-weight: 600; opacity: 1; }
  .stopclk { cursor: pointer; } .stopclk:hover { text-decoration: underline; }

  /* pick 弹层（overlay.ts:44-50, 375-391）：❯ 选中 + accentSoft 整行软底 */
  .pickrow { display: flex; gap: 6px; padding: 3px 6px; font-size: 12.5px; color: var(--fg); border-radius: 4px; }
  .pickrow .mk { width: 12px; color: var(--accent); }
  .pickrow.sel { background: var(--accent-soft); }
  .pickrow.clk { cursor: pointer; } .pickrow.clk:hover { background: var(--accent-soft); }

  /* 居中/贴底查看窗（popuplayout.ts:46-93 / tasks-cmd.ts:476-486） */
  .overlay { position: absolute; inset: 0; background: rgba(5, 9, 7, .55); display: flex; align-items: center; justify-content: center; padding: 26px; }
  .overlay.bottom { align-items: flex-end; padding: 0; }
  .modal { width: 80%; height: 80%; max-height: 92%; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface2); position: relative; display: flex; flex-direction: column; }
  .overlay.bottom .modal { width: 100%; max-width: 100%; height: 82%; border-radius: 6px 6px 0 0; }
  .modal .head { position: absolute; top: -8px; left: 10px; background: var(--surface2); padding: 0 6px; font-size: 11px; color: var(--accent); }
  .modal .hk { position: absolute; top: -8px; right: 10px; background: var(--surface2); padding: 0 6px; font-size: 11px; color: var(--muted); opacity: .8; }
  .modal-body { padding: 10px 16px 8px; overflow-y: auto; font-size: 12.5px; flex: 1; }

  .md-h { color: var(--accent); font-weight: 600; margin: 10px 0 4px; font-size: 12.5px; }
  .md-h .badge { color: var(--muted); opacity: .7; font-weight: 400; font-size: 11px; margin-left: 6px; }
  .md-p { color: var(--fg); margin: 2px 0; }
  .md-p.dim { color: var(--muted); }
  .md-quote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--muted); opacity: .8; margin: 4px 0; }
  .issue { color: var(--warn); margin: 2px 0 2px 12px; }
  .issue::before { content: "▸ "; }
  table.mdt { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 12px; }
  table.mdt th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); padding: 2px 6px; }
  table.mdt td { padding: 3px 6px; color: var(--fg); border-bottom: 1px solid var(--border); }

  .statusline1 { color: var(--accent); margin: 2px 0 6px; }
  .roster-hint { font-size: 11px; color: var(--muted); opacity: .62; padding: 6px 2px 0; }

  .backlink, .escnote a { color: var(--info); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .escnote { color: var(--muted); opacity: .62; font-size: 11.5px; text-align: center; margin-top: 8px; }

  /* ─── 右侧注记面板 ───────────────────────────────────────── */
  .notes { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px 16px; font-size: 13px; color: var(--muted); position: sticky; top: 12px; }
  .notes h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--fg); }
  .notes h3 .no { color: var(--accent); font-family: var(--font-mono); margin-right: 6px; }
  .notes .ops { margin: 10px 0 0; padding: 8px 12px; border: 1px dashed var(--border); border-radius: 8px; background: rgba(24,36,30,.5); }
  .notes .ops .t { color: var(--warn); font-size: 11.5px; letter-spacing: .05em; margin-bottom: 4px; }
  .notes .ops ul { margin: 0; padding-left: 16px; }
  .notes .ops li { margin: 3px 0; color: var(--fg); font-size: 12.5px; }
  .notes .why { margin: 10px 0 0; font-size: 12.5px; }
  .notes .why b { color: var(--fg); }
  .notes .anchor { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); opacity: .75; font-family: var(--font-mono); border-top: 1px dashed var(--border); padding-top: 6px; }
</style>
</head>
<body>

<div class="notebar">
  <b>三省六部 · 朝会 UI 原型（真实 UI 体系复刻版）</b>——本页所有形态逐项对齐真实 TUI 渲染代码：色值=theme.ts、框系=╭╮╰╯ 圆角（CSS 圆角近似）、输入框/弹窗铺 <b>surface2 底</b>、面板内底透明、选中=❯+软底、进度=█░▏…、思考折叠=<b>[思考] · Alt + E 展开</b>、子代理=<b>流区组树形</b>、结果折叠=<b>… 还有 N 行 · Alt + O 展开全部</b>、toast=<b>无框暖金字</b>。每屏注记尾有「复刻锚点」file:line——实施批照锚点做，不会跑偏。点步骤条或 ←/→ 推进；三条支线：第 4 步 Esc、第 9 步 Alt+C/点工部行。
</div>

<div class="wrap">
  <div class="stepbar" id="stepbar"></div>
  <div class="navrow">
    <button class="navbtn" id="prev">← 上一步</button>
    <button class="navbtn" id="next">下一步 →</button>
    <span class="pos" id="pos"></span>
    <button class="navbtn" id="restart" style="margin-left:auto">↺ 重新走查</button>
  </div>

  <div class="layout">
    <div class="term" id="term"></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script>
/* ══════════ 状态与导航（与上一版引擎同构） ══════════ */
const S = { i: 0, choice: null, memOpen: false, rosSel: -1 };

/* ── 通用行 ── */
const dim = (t) => `<span class="dim">${t}</span>`;
const dim2 = (t) => `<span class="dim2">${t}</span>`;
const acc = (t) => `<span class="acc">${t}</span>`;
const w = (t) => `<span class="warn">${t}</span>`;

/* 工具行：● Using/Used name (arg) · chip（docmodel.ts:870-875 / render.ts:114-127） */
const toolLine = ({ busy, used, name, arg, chip, fail }) => `
  <div class="tl ${busy ? "busy" : ""} ${fail ? "fail" : ""}"><span class="dot">●</span> <span class="verb">${busy ? "Using" : "Used"} </span><span class="tname">${name}</span><span class="tail">${arg ? ` (${arg})` : ""}${chip ? ` · ${chip}` : ""}${busy ? " …" : ""}</span></div>`;

/* 子代理组树（subagent-status.ts:85-150） */
function agentGroup(first, firstCls, children) {
  return `<div class="grp"><div class="grp-first ${firstCls}">${first}</div>` +
    children.map((c, i) => {
      const branch = i === children.length - 1 ? "└─" : "├─";
      return `<div class="grp-sub">  <span class="branch">${branch}</span>  <span class="gname">${c.name}</span><span class="gstats">${c.stats}·${c.st}</span></div>`;
    }).join("") + `</div>`;
}

/* 思考块折叠态：头行 + 尾两行（docmodel.ts:174-181） */
const thinkCollapsed = (l1, l2) => `
  <div class="think-head">[思考] · Alt + E 展开</div>
  <div class="think-tail">${l1}</div><div class="think-tail">${l2}</div>`;

/* 技能加载行（docmodel.ts:940-942） */
const skillLine = (name) => `
  <div class="tl"><span class="dot">●</span> <span class="verb">已加载技能 </span><span class="tname">${name}</span><span class="tail"> · 正文已注入模型上下文</span></div>`;

/* 流区尾行（fullapp-panels.ts:123-142） */
const tailLine = (mode) => mode === "busy"
  ? `<div class="tail-line"><span class="sp">⠹</span> ${dim("正在生成…")}</div>`
  : `<div class="tail-line">${dim2("正在待命")}</div>`;

/* 结果折叠行（docmodel.ts:494） */
const foldLine = (n, act) => `<div class="foldline ${act ? "clk" : ""}" ${act ? `data-act="${act}"` : ""}>… 还有 ${n} 行 · Alt + O 展开全部</div>`;

/* 进度条：█ ▏▎▍▌▋▊▉ ░（widgets.ts:108-124） */
function bar(ratio, width, pctText) {
  const FRACS = ["", "▏", "▎", "▍", "▌", "▋", "▊", "▉"];
  const total = Math.min(width, Math.max(0, Math.round(ratio * width * 8) / 8));
  const full = Math.floor(total);
  const frac = (full < width && total - full > 0) ? FRACS[Math.min(7, Math.ceil((total - full) * 8))] : "";
  const empty = Math.max(0, width - full - (frac ? 1 : 0));
  return `<span class="bar">${"█".repeat(full)}${frac}<span class="empty">${"░".repeat(empty)}</span></span> <span class="num">${pctText}</span>`;
}

/* 右栏卡片壳：╭─ title ── en ─╮ 顶边嵌标题（panels.ts:17-46） */
const card = (title, en, inner, focus) => `
  <div class="card ${focus ? "focus" : ""}"><span class="head">${title}</span>${en ? `<span class="en">${en}</span>` : ""}${inner}</div>`;

const sepRow = `<div class="sep">${"┄".repeat(28)}</div>`;

/* 状态卡（panels.ts:154-188 真实字段序） */
function statusCard(court) {
  const mods = [
    { d: "●", cls: "acc", nm: "tool-fs", st: "已挂载" },
    { d: "●", cls: "acc", nm: "tool-subagent", st: "已挂载" },
    court ? { d: "◐", cls: "warn", nm: `sansheng-liubu`, st: "朝会进行中" } : { d: "●", cls: "acc", nm: "sansheng-liubu", st: "已挂载" },
  ];
  return card("状态", "1/2", `
    <div class="crow"><span class="k">模型</span><span class="v">GLM-5.3</span></div>
    <div class="crow"><span class="k">会话</span><span class="v">tool-fs 重构</span></div>

const NAMES = ["入口","开朝","中书","请旨","续稿","门下①","门下②","尚书","波1","波2","奏章","实录","花名册"];

function stepDef(id) {
  if (id === "b1" || id === "b2" || id === "b3") return BRANCHES[id];
  return STEPS[Number(id)];
}

/* 请旨弹层：挂在 frame 的 overlay 位（第 4 步专用渲染） */
function renderAskOverlay() {
  return `<div class="overlay" style="align-items:flex-end;padding:0 0 0"><div class="modal" style="width:100%;max-width:100%;height:auto;border-radius:6px 6px 0 0">
    <span class="head">请旨 · 中书省——tool-ask__ask_user</span><span class="hk">↑↓ 选择 · Enter 选定 · Esc 取消</span>
    <div class="modal-body" style="overflow:hidden">

      <div class="pickrow sel clk" data-go="4" data-choice="A"><span class="mk">❯</span><span>A 允许破坏——同步更新所有调用方</span></div>
      <div class="pickrow clk" data-go="4" data-choice="B"><span class="mk"> </span><span>B 不允许——保持 API 兼容，旧签名留垫片</span></div>

    </div></div></div>`;
}

function render() {
  const id = S.i;
  const def = stepDef(id);
  let html = def.html();
  document.getElementById("term").innerHTML = html;

  const isBranch = def.branch;
  document.getElementById("notes").innerHTML = `
    <h3><span class="no">${isBranch ? "支线" : "第 " + (Number(id) + 1) + " 步"}</span>${def.name}</h3>
    <div>${def.what}</div>
    <div class="ops"><div class="t">可操作</div><ul>${def.ops.map(o => `<li>${o}</li>`).join("")}</ul></div>
    <div class="why"><b>机制注记：</b>${def.why}</div>
    <div class="anchor">复刻锚点：${def.anchor || ""}</div>`;

  document.getElementById("stepbar").innerHTML = NAMES.map((n, i) =>
    `<span class="chip ${String(i) === id ? "cur" : (i <= Number(id) ? "done" : "")}" data-go="${i}"><span class="n">${i + 1}</span>${n}</span>`).join("");
  document.getElementById("pos").textContent = isBranch ? `支线：${def.name}` : `${Number(id) + 1} / ${STEPS.length}`;
  document.getElementById("prev").disabled = isBranch || Number(id) === 0;
  document.getElementById("next").disabled = isBranch || Number(id) === STEPS.length - 1;
}

function go(id, choice) {
  if (choice) S.choice = choice;
  S.i = String(id);
  S.memOpen = false;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-act]");
  if (!el) return;
  if (el.dataset.go !== undefined) { go(el.dataset.go, el.dataset.choice); return; }
  if (el.dataset.act === "mem") { S.memOpen = !S.memOpen; render(); return; }
  if (el.dataset.act === "ros") { S.rosSel = Number(el.dataset.i); render(); return; }
  if (el.dataset.act === "enter") { go("1"); return; }
  if (el.dataset.act === "finish") { document.querySelector(".notes .why").innerHTML = "<b>走查完毕。</b>↺ 重新走查或关掉文件。三条支线（请旨 Esc / Alt+C / 点工部行）都试过了吗？"; return; }
});
document.getElementById("prev").onclick = () => { if (Number(S.i) > 0) go(Number(S.i) - 1); };
document.getElementById("next").onclick = () => { if (Number(S.i) < STEPS.length - 1) go(Number(S.i) + 1); };
document.getElementById("restart").onclick = () => { S.choice = null; S.rosSel = -1; go(0); };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
});
render();
</script>
</body>
</html>
